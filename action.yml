name: "Start Wiz Sensor"
description: "Runs the Wiz Sensor in the background."
author: "Wiz"
inputs:
  token:
    description: "JSON token containing registry credentials and Wiz API client credentials"
    required: true
  tag:
    description: "Wiz Sensor image tag"
    required: false
    default: "github_runner_private_preview"
  backend-env:
    description: "Wiz backend environment"
    required: false
    default: "prod"
  wait-for-ready:
    description: "Wait for the Wiz Sensor to report ready before continuing"
    required: false
    default: "true"
  install-only:
    description: "Only pull and cache the Wiz Sensor image without starting it. Useful for pre-warming custom GitHub runner images."
    required: false
    default: "false"
  allow-self-hosted:
    description: "Allow starting the Wiz Sensor container on a self-hosted runner"
    required: false
    default: "false"
  debug-logs:
    description: "Enable debug logging for the action"
    required: false
    default: "false"
  generate-support-package:
    description: "After the workflow steps finish, collect a Wiz Sensor support package and upload it as a workflow artifact for troubleshooting."
    required: false
    default: "false"
  extra-env:
    description: "Newline-delimited KEY=VALUE environment entries to pass to the sensor container"
    required: false
  sensor-registry-url:
    description: "Container registry hostname for the Wiz Sensor image"
    required: false
    default: "wizio.azurecr.io"
  allow-custom-registry:
    description: "Allow pulling the Wiz Sensor image from a registry that is not a known Wiz registry"
    required: false
    default: "false"
  skip-image-verification:
    description: "Skip cryptographic verification of the Wiz Sensor image signature before starting it"
    required: false
    default: "false"
  sensor-image-name:
    description: "Wiz Sensor image name"
    required: false
    default: "sensor"
  sensor-container-name:
    description: "Docker container name for the Wiz Sensor"
    required: false
    default: "wiz-sensor"

runs:
  using: "node24"
  main: "dist/main/index.js"
  post: "dist/post/index.js"

branding:
  icon: "shield"
  color: "blue"
